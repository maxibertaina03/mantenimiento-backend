version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mantenimiento2-postgres
    environment:
      POSTGRES_USER: mantenimiento
      POSTGRES_PASSWORD: mantenimiento
      POSTGRES_DB: mantenimiento
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mantenimiento -d mantenimiento"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mantenimiento-network

volumes:
  postgres_data:
    driver: local

networks:
  mantenimiento-network:
    driver: bridge
